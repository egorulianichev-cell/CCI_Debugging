version: 2.1

executors:
  base:
    docker:
      - image: cimg/base:2026.03
    resource_class: small

jobs:
  test_count:
    executor: base
    steps:
      - checkout
      - run:
          name: Add Test Vars
          command: |
            echo 'export TEST_VAR="Hello World!"' >> $BASH_ENV

      - run: 
          name: Display Var
          command:
            echo "What a beautiful day! $TEST_VAR"
      
      - run:
          name: Check file exists
          command: |
            if [ -e "tests.xml" ] ; then
              echo "tests.xml is a file!!"
            fi
      - run:
          name: Remove system-out tags from JUnit XML
          command: |
            cp tests.xml tests-original.xml
            awk '/<system-out>/{skip=1} !skip{print} /<\/system-out>/{skip=0}' tests.xml > results.xml
            ls -l
      - store_artifacts:
          path: tests-original.xml
      - store_test_results:
          path: results.xml

workflows:
  check-tests:
    jobs:
      - test_count