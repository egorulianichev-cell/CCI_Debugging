version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:stable
    steps:
      # 1) Clone this project's repo (uses the project's checkout key)
      - checkout

      # 2) Load an additional SSH key for cloning other private repos
      - add_ssh_keys:
          fingerprints:
            - "SHA256:0zvykFzanVqR/KQkNX8Yi1+dGSLZyZZ2rtgHrpPFEuY"

      - run:
          name: Clone ad_astra_test_stand over SSH
          command: |
            mkdir -p ~/deps && cd ~/deps

            echo "=== ~/.ssh contents ==="
            ls -la ~/.ssh
            echo "=== ssh-agent keys ==="
            ssh-add -l || true
            echo "=== ssh config ==="
            cat ~/.ssh/config || true

            # Prefer additional key (id_rsa_<md5>), not checkout id_rsa
            KEY=$(find ~/.ssh -maxdepth 1 -type f \
              \( -name 'id_rsa_*' -o -name 'id_ed25519_*' -o -name 'id_ecdsa_*' \) \
              ! -name '*.pub' | head -1)
            echo "Using key: ${KEY:-NONE}"
            test -n "$KEY" || { echo "ERROR: no additional key file"; exit 1; }

            GIT_TRACE=1 \
            GIT_SSH_COMMAND="ssh -vvv -i $KEY -o IdentitiesOnly=yes" \
              git clone --depth 1 --progress \
              git@github.com:egorulianichev-cell/ad_astra_test_stand.git

      - run:
          name: Example build step
          command: |
            ls -la
            ls -la ~/deps/PRIVATE-REPO

workflows:
  main:
    jobs:
      - build