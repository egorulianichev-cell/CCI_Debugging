version: 2.1

executors:
  base:
    docker:
      - image: cimg/base:2026.03
    resource_class: small

jobs:
  docker_dlc:
    executor: base
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build Image
          command: |
            docker build . -f Dockerfile

workflows:
  check-tests:
    jobs:
      - docker_dlc