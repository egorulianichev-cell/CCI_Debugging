version: 2.1

executors:
  base:
    docker:
      - image: cimg/base:2026.03
    resource_class: small

jobs:
  test_count:
    executor: base
    steps:
      - checkout
      - run:
          name: Add Test Vars
          command: |
            echo 'export TEST_VAR="Hello World!"'

      - run: 
          name: Display Var
          command:
            echo "What a beautiful day! $TEST_VAR"
            echo 'What a beautiful day! $TEST_VAR'
            echo 'What a beautiful day! ${TEST_VAR}'
      
      - run:
          name: Check file exists
          command: |
            if [ -e "tests.xml" ] ; then
              echo "tests.xml is a file!!"
            fi
      - store_test_results: 
          path: test.xml

workflows:
  check-aws-cli-installation:
    jobs:
      - test_count