version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:stable
    steps:
      # 1) Clone this project's repo (uses the project's checkout key)
      - checkout

      # 2) Load an additional SSH key for cloning other private repos
      - add_ssh_keys:
          fingerprints:
            - "SHA256:7z0CaWk83Drdfac7z0uvR1pSihDj3mdxFPWlyUTrDlA"

      - run:
          name: Clone ad_astra_test_stand over SSH
          command: |
            mkdir -p ~/deps && cd ~/deps
            GIT_SSH_COMMAND='ssh -o IdentitiesOnly=yes' \
              git clone --depth 1 git@github.com:egorulianichev-cell/ad_astra_test_stand.git

      - run:
          name: Example build step
          command: |
            ls -la
            ls -la ~/deps/PRIVATE-REPO

workflows:
  main:
    jobs:
      - build