version: 2.1

executors:
  container-runner:
    docker: 
      - image: cimg/python:3.14.5
    resource_class: egorulianichev-cell/container-runner

jobs:
  parallelism-1:
    executor: container-runner
    steps:
      - run:
          name: Run container with parallelism degree of 1
          command: |
            for I in {1..30}; do
              echo "This is $I iteration"
              sleep 10
            done
    parallelism: 1
  
  parallelism-3:
    executor: container-runner
    steps:
      - run:
          name: Run containers with parallelism degree of 3
          command: |
            for I in {1..30}; do
              echo "This is $I iteration"
              sleep 10
            done
    parallelism: 3

workflows:
  test-concurrency-usage:
    jobs:
      - parallelism-1
