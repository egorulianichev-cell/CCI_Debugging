version: 2.1

executors:
  base:
    docker:
      - image: cimg/base:2026.03
    resource_class: small
jobs:

  verify-ios-sdk:
    parameters:
      xcode-version: 
        type: string
    macos:
      xcode: << parameters.xcode-version >>
    resource_class: m4pro.medium
    steps:
      - run:
          name: List installed iOS SDK
          command: |
            xcodebuild -showsdks | grep -i iphoneos
      - run:
          name: Check Xcode active iOS version
          command: |
            xcode-select -p
