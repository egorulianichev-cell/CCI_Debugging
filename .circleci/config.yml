version: 2.1

executors:
  default:
    docker:
      - image: cimg/base:stable

jobs:
  prepare:
    executor: default
    steps:
      - run: echo "standalone job before serial group"

  step-one:
    executor: default
    steps:
      - run: echo "inside serial group - step one"

  step-two:
    executor: default
    steps:
      - run: echo "inside serial group - step two (leaf job)"

  after-group:
    executor: default
    steps:
      - run: echo "outside serial group - depends on group compiled serial-end success"

  final:
    executor: default
    steps:
      - run: echo "depends on after-group"

job-groups:
  my-serial-group:
    jobs:
      - step-one
      - step-two:
          requires:
            - step-one

workflows:
  demo:
    jobs:
      - prepare

      - my-serial-group:
          serial-group: << pipeline.project.slug >>/demo-serial
          requires:
            - prepare

      - after-group:
          requires:
            - my-serial-group

      - final:
          requires:
            - after-group