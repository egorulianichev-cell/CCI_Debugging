version: 2.1
# Test job: verifies apt-get can download a large package (>5 MB) from the
# Ubuntu mirror on an ubuntu-2604:current / medium.gen2 machine.
# Purpose: surface mirror connectivity issues (e.g. us-east-1.ec2.archive.ubuntu.com
# size-mismatch / timeout failures).
jobs:
  test-apt-large-package:
    machine:
      image: ubuntu-2604:current
    resource_class: medium.gen2
    steps:
      - run:
          name: Show mirror configuration
          command: |
            echo "=== /etc/apt/sources.list ==="
            cat /etc/apt/sources.list 2>/dev/null || echo "(empty)"
            echo ""
            echo "=== /etc/apt/sources.list.d/ ==="
            cat /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || echo "(empty)"
      - run:
          name: Check mirror reachability
          command: |
            MIRROR=$(grep -hEo 'https?://[^/]+' /etc/apt/sources.list /etc/apt/sources.list.d/*.list \
              /etc/apt/sources.list.d/*.sources 2>/dev/null | sort -u | head -1)
            echo "Primary mirror: ${MIRROR}"
            echo "Probing root..."
            curl -sS --max-time 10 "${MIRROR}/" -o /dev/null \
              -w "HTTP %{http_code}  size=%{size_download}B  time=%{time_total}s\n" || true
            echo "Probing noble-updates InRelease..."
            curl -sS --max-time 10 \
              "${MIRROR}/ubuntu/dists/noble-updates/InRelease" -o /dev/null \
              -w "HTTP %{http_code}  size=%{size_download}B  time=%{time_total}s\n" || true
      - run:
          name: apt-get update
          command: sudo apt-get update
      - run:
          name: Install large package (ffmpeg, ~30 MB download)
          command: |
            # ffmpeg is reliably >5 MB and exercises the universe/multiverse mirrors.
            # Use DEBIAN_FRONTEND=noninteractive to avoid interactive prompts.
            DEBIAN_FRONTEND=noninteractive sudo apt-get install -y ffmpeg
      - run:
          name: Verify package size downloaded
          command: |
            INSTALLED=$(dpkg-query -W -f='${Installed-Size}\n' ffmpeg 2>/dev/null || echo 0)
            echo "Installed size: ${INSTALLED} KB"
            # Sanity-check: installed size should be well over 5 MB (5120 KB)
            if [ "${INSTALLED}" -lt 5120 ]; then
              echo "ERROR: installed package is smaller than expected (< 5 MB)" >&2
              exit 1
            fi
            echo "OK: package is >= 5 MB"
            ffmpeg -version | head -2
workflows:
  mirror-health-check:
    jobs:
      - test-apt-large-package